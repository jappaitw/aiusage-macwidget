name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      # 有 MACOS_CERT_P12_BASE64 secret → Developer ID 簽章＋公證；
      # 沒有 → 跳過，release.sh 會自動退回 ad-hoc（universal、可安裝，但使用者要自己過 Gatekeeper）
      - name: Import Developer ID certificate
        if: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC"

      - name: Build, sign, notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="$GITHUB_REF_NAME"
          [[ "$VERSION" == v* ]] && VERSION="${VERSION#v}" || VERSION=""
          ./scripts/release.sh $VERSION

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE=""
          if ls dist/*-unsigned.dmg >/dev/null 2>&1; then
            NOTE="$(printf '> [!NOTE]\n> 這個 DMG 未經 Apple 公證。安裝後第一次啟動前先執行：\n> ```\n> xattr -dr com.apple.quarantine /Applications/AIUsage.app\n> ```\n')"
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "AI Usage $GITHUB_REF_NAME" --generate-notes \
            ${NOTE:+--notes "$NOTE"}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmg
          path: dist/*.dmg
          if-no-files-found: ignore
