name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project AIUsage.xcodeproj -scheme AIUsage -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build > build.log 2>&1 || true
          python3 - <<'PY'
          import re
          seen = []
          for line in open("build.log", errors="replace"):
              m = re.search(r"(?:^|/)((?:App|Shared|Widget)/[^:]+:\d+:\d+: (?:warning|error): .*)", line)
              if m and m.group(1) not in seen:
                  seen.append(m.group(1))
          for msg in seen[:40]:
              print(("::error::" if ": error: " in msg else "::warning::") + msg.strip())
          print(f"::notice::{len(seen)} compiler diagnostics")
          PY
          tail -3 build.log
          grep -q "BUILD SUCCEEDED" build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
